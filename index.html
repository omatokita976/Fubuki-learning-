<style>
:root{--bg1:#fdf2f8;--bg2:#f1e6ff;--card:rgba(255,255,255,.72);--tx:#2e1a47;--mu:#7a6892;--ac:#a855c7;--ac2:#ec6fb0;--ok:#1f8a55;--ko:#c2347a;--bd:rgba(168,85,199,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1b1026;--bg2:#2c1646;--card:rgba(48,28,72,.7);--tx:#f6eefc;--mu:#b9a5d1;--ac:#c58bf0;--ac2:#f08cc4;--ok:#6fdca0;--ko:#ff8fc0;--bd:rgba(197,139,240,.28)}}
:root[data-theme="dark"]{--bg1:#1b1026;--bg2:#2c1646;--card:rgba(48,28,72,.7);--tx:#f6eefc;--mu:#b9a5d1;--ac:#c58bf0;--ac2:#f08cc4;--ok:#6fdca0;--ko:#ff8fc0;--bd:rgba(197,139,240,.28)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--tx);font:17px/1.5 "Avenir Next",Avenir,"Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
.bubbles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bubbles i{position:absolute;bottom:-160px;border-radius:50%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.75),rgba(236,111,176,.22) 45%,rgba(168,85,199,.16));border:1px solid rgba(255,255,255,.45);animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.85}90%{opacity:.7}100%{transform:translate(var(--dx,30px),-120vh);opacity:0}}
@media (prefers-reduced-motion:reduce){.bubbles i{animation:none;opacity:.35;bottom:auto}}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:28px 18px 48px}
h1{font:600 2rem/1.15 Georgia,"Times New Roman",serif;letter-spacing:.3px;margin:8px 0 6px;text-align:center;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:6px 0 16px;color:var(--mu)}
main>p{text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(168,85,199,.16)}
button{display:block;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin:10px 0;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s,border-color .15s,box-shadow .15s}
button:hover:not(:disabled){border-color:var(--ac);transform:translateY(-1px);box-shadow:0 6px 18px rgba(168,85,199,.18)}
button:disabled{cursor:default}
button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
button.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 16%,var(--card))}
button.go{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;text-align:center;border:0;font-weight:600;letter-spacing:.3px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar div{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:3px;transition:width .3s}
.q{font:600 1.2rem/1.4 Georgia,"Times New Roman",serif;margin:0 0 10px;color:var(--tx)}
.fb{color:var(--tx);font-size:.95rem;margin:10px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:6px 0 10px}
input:focus,textarea:focus{outline:2px solid var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.logo{display:block;position:relative;z-index:1;width:96px;height:96px;margin:24px auto -10px;border-radius:50%;object-fit:cover;border:3px solid var(--ac);box-shadow:0 8px 24px rgba(168,85,199,.3)}
body.auth{--bg1:#e9edff;--bg2:#d6ccff;--tx:#1d1a4a;--mu:#5d5a8a;--ac:#4f46e5;--ac2:#8b5cf6;--bd:rgba(79,70,229,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.auth{--bg1:#0c0d2e;--bg2:#1e1760;--card:rgba(30,26,86,.7);--tx:#eef0ff;--mu:#aeb0e0;--ac:#8c9bff;--ac2:#b39bff;--bd:rgba(140,155,255,.3)}}
:root[data-theme="dark"] body.auth{--bg1:#0c0d2e;--bg2:#1e1760;--card:rgba(30,26,86,.7);--tx:#eef0ff;--mu:#aeb0e0;--ac:#8c9bff;--ac2:#b39bff;--bd:rgba(140,155,255,.3)}
body.auth .bubbles i{background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.75),rgba(91,91,214,.22) 45%,rgba(60,60,180,.16))}
body.auth .card{box-shadow:0 12px 40px rgba(79,70,229,.2)}
body.signup{--bg1:#e4fbf4;--bg2:#c9efe6;--tx:#0f3a36;--mu:#4b7f78;--ac:#0f9d8a;--ac2:#34c98a;--bd:rgba(15,157,138,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.signup{--bg1:#06201d;--bg2:#0d3b36;--card:rgba(14,52,48,.7);--tx:#e8fffa;--mu:#9fd6cc;--ac:#4fe0c8;--ac2:#7ee8a8;--bd:rgba(79,224,200,.3)}}
:root[data-theme="dark"] body.signup{--bg1:#06201d;--bg2:#0d3b36;--card:rgba(14,52,48,.7);--tx:#e8fffa;--mu:#9fd6cc;--ac:#4fe0c8;--ac2:#7ee8a8;--bd:rgba(79,224,200,.3)}
body.signup .bubbles i{background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.75),rgba(20,184,166,.22) 45%,rgba(15,157,138,.16))}
body.signup .card{box-shadow:0 12px 40px rgba(15,157,138,.2)}
.logo{cursor:default;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.big{font:700 3rem Georgia,serif;text-align:center;margin:10px 0;color:var(--ac)}
.card h1{font-size:1.6rem}
</style>
</head>

const UK="fubuki_users_v1",AK="fubuki_admin_v1",enc=new TextEncoder();
let isAdmin=false,fails=0,lock=0,fresh=false;
function btn(t,f,c){const b=el("button",c||null,t);b.type="button";b.addEventListener("click",f);return b}
const b64=u=>btoa(String.fromCharCode(...u));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pbk(pw,salt){const k=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:150000,hash:"SHA-256"},k,256))}
function same(a,b){if(a.length!==b.length)return false;let d=0;for(let k=0;k<a.length;k++)d|=a[k]^b[k];return d===0}
function rd(k,def){try{const v=JSON.parse(localStorage.getItem(k));return v==null?def:v}catch(e){return def}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
async function mk(pw){const s=crypto.getRandomValues(new Uint8Array(16));return{s:b64(s),h:b64(await pbk(pw,s))}}
async function chk(pw,r){try{return same(await pbk(pw,unb64(r.s)),unb64(r.h))}catch(e){return false}}
function users(){const a=rd(UK,[]);return Array.isArray(a)?a.filter(x=>x&&typeof x.p==="string"&&typeof x.s==="string"&&typeof x.h==="string"&&typeof x.c==="number"):[]}
function setWho(p){who=p;try{p?sessionStorage.setItem("fubuki_who",p):sessionStorage.removeItem("fubuki_who")}catch(e){}}
function noCrypto(m){if(!window.crypto||!crypto.subtle){m.textContent="Ce navigateur ne permet pas la connexion sécurisée.";return true}return false}
function auth(){
  clear();document.body.classList.add("auth");
  app.append(el("h1",null,"❄️ Fubuki Learning"),el("p",null,"Connecte-toi pour jouer."));
  const card=el("div","card");
  const u=el("input");u.type="text";u.maxLength=20;u.placeholder="Pseudo";u.autocomplete="username";u.setAttribute("aria-label","Pseudo");
  const w=el("input");w.type="password";w.maxLength=64;w.placeholder="Mot de passe";w.autocomplete="current-password";w.setAttribute("aria-label","Mot de passe");
  const m=el("p","fb");
  const login=btn("Se connecter",async()=>{
    if(noCrypto(m))return;
    if(Date.now()<lock){m.textContent="Trop d’essais. Patiente 30 secondes.";return}
    const p=clean(u.value),x=users().find(y=>y.p.toLowerCase()===p.toLowerCase());
    login.disabled=true;const ok=x?await chk(w.value,x):false;login.disabled=false;
    if(ok){fails=0;setWho(x.p);home()}else{fails++;if(fails>=5){lock=Date.now()+30000;fails=0}m.textContent="Pseudo ou mot de passe incorrect."}
  },"go");
  card.append(u,w,m,login);app.append(card,btn("Pas encore de compte ? Créer un compte",signup));
}
function signup(){
  clear();document.body.classList.add("signup");
  app.append(el("h1",null,"✨ Créer mon compte"),el("p",null,"Choisis un pseudo et un mot de passe."));
  const card=el("div","card");
  const u=el("input");u.type="text";u.maxLength=20;u.placeholder="Pseudo (3 à 20 caractères)";u.autocomplete="username";u.setAttribute("aria-label","Pseudo");
  const w=el("input");w.type="password";w.maxLength=64;w.placeholder="Mot de passe (8 caractères min.)";w.autocomplete="new-password";w.setAttribute("aria-label","Mot de passe");
  const w2=el("input");w2.type="password";w2.maxLength=64;w2.placeholder="Confirmer le mot de passe";w2.autocomplete="new-password";w2.setAttribute("aria-label","Confirmer le mot de passe");
  const m=el("p","fb");
  const sign=btn("Créer mon compte",async()=>{
    if(noCrypto(m))return;
    const p=clean(u.value),pw=w.value;
    if(p.length<3){m.textContent="Pseudo : 3 à 20 caractères (lettres, chiffres, espaces, - ou _).";return}
    if(pw.length<8||pw.length>64){m.textContent="Mot de passe : 8 à 64 caractères.";return}
    if(pw!==w2.value){m.textContent="Les mots de passe ne correspondent pas.";return}
    const us=users();
    if(us.some(y=>y.p.toLowerCase()===p.toLowerCase())){m.textContent="Ce pseudo existe déjà.";return}
    sign.disabled=true;const r=await mk(pw);sign.disabled=false;
    us.push({p:p,s:r.s,h:r.h,c:Date.now()});
    if(!wr(UK,us)){m.textContent="Impossible d’enregistrer le compte (stockage bloqué).";return}
    fresh=true;setWho(p);home();
  },"go");
  card.append(u,w,w2,m,sign);app.append(card,btn("← J’ai déjà un compte",auth));
}
function adminGate(){
  clear();
  const a=rd(AK,null),has=!!(a&&typeof a.s==="string"&&typeof a.h==="string");
  const card=el("div","card");card.append(el("h1",null,"🔐 Espace admin"),el("p",null,has?"Entre le mot de passe admin.":"Première utilisation : crée le mot de passe admin (10 caractères min.). Fais-le toi-même, sur ton appareil."));
  const w=el("input");w.type="password";w.maxLength=64;w.autocomplete="current-password";w.setAttribute("aria-label","Mot de passe admin");
  const m=el("p","fb");
  const go=btn(has?"Entrer":"Créer le mot de passe",async()=>{
    if(noCrypto(m))return;
    if(Date.now()<lock){m.textContent="Trop d’essais. Patiente 30 secondes.";return}
    const pw=w.value;go.disabled=true;
    if(!has){
      if(pw.length<10||pw.length>64){m.textContent="10 à 64 caractères.";go.disabled=false;return}
      if(!wr(AK,await mk(pw))){m.textContent="Stockage bloqué.";go.disabled=false;return}
      isAdmin=true;admin();return;
    }
    const ok=await chk(pw,a);go.disabled=false;
    if(ok){fails=0;isAdmin=true;admin()}else{fails++;if(fails>=5){lock=Date.now()+30000;fails=0}m.textContent="Mot de passe incorrect."}
  },"go");
  card.append(w,m,go,btn("← Retour",home));app.append(card);
}
function admin(){
  if(!isAdmin)return adminGate();
  clear();
  const us=users(),lb=loadLB(),card=el("div","card");
  card.append(el("h1",null,"🔐 Admin"),el("p",null,us.length+" compte(s) sur cet appareil"));
  us.forEach(x=>{
    const mine=lb.filter(e=>e.n===x.p),best=mine.reduce((m,e)=>Math.max(m,e.s),0);
    const r=el("div","row");
    r.append(el("span",null,x.p+" · créé le "+new Date(x.c).toLocaleDateString("fr-FR")+" · "+mine.length+" partie(s) · meilleure note "+best+"/20"));
    let armed=false;
    const d=btn("🗑",()=>{if(!armed){armed=true;d.textContent="Confirmer ?";return}wr(UK,users().filter(y=>y.p!==x.p));wr(KEY,loadLB().filter(e=>e.n!==x.p));admin()});
    d.style.width="auto";r.append(d);card.append(r);
  });
  card.append(el("h1",null,"📅 Classement par jour"));
  const di=el("input");di.type="date";di.value=dk(Date.now());
  const box=el("div");
  const show=()=>{box.textContent="";if(!di.value)return;const rows=loadLB().filter(e=>dk(e.t)===di.value).sort((a,b)=>b.s-a.s);
    if(!rows.length){box.append(el("p",null,"Aucune partie ce jour."));return}
    rows.forEach((e,k)=>{const r=el("div","row");r.append(el("span",null,(k+1)+". "+e.n+" · "+String(e.c||"")),el("span",null,e.s+"/20"));box.append(r)})};
  di.addEventListener("change",show);show();
  card.append(di,box,btn("← Retour",()=>{isAdmin=false;home()}));app.append(card);
}
function home(){
  clear();lvl=null;
  if(!who)return auth();
  const nw=fresh;fresh=false;
  app.append(el("h1",null,"❄️ Fubuki Learning"),el("p",null,(nw?"Compte créé ✅ · ":"Bienvenue "+who+" · ")+"Étape 1/2 : choisis ta classe."),el("p","fb","Contenu éducatif, ne remplace pas un conseil juridique."));
  app.append(btn("🏆 Voir le classement",ranking));
  LEVELS.forEach((L,k)=>app.append(btn(L.n+" · "+L.s,()=>pays(k))));

function start(k,p){ci=k;cp=p;const C=LEVELS[k];lvl={n:C.n+" · "+p.n,q:p.m?C.q:(k<4?p.c:p.l)};order=shuffle(lvl.q);i=0;score=0;sp=0;ask()}
function ask(){
  clear();
  const d=order[i];
  const bar=el("div","bar");const f=el("div");f.style.width=(i/order.length*100)+"%";bar.append(f);
  const card=el("div","card");
  card.append(el("p",null,lvl.n+" · Question "+(i+1)+"/"+order.length),bar,el("p","q",d[0]));
  const opts=shuffle(d[1].map((t,idx)=>({t,ok:idx===d[2]})));
  const btns=[];
  const next=el("button","go",i+1<order.length?"Suivant →":"Voir mon score");next.type="button";next.hidden=true;
  next.addEventListener("click",()=>{i++;i<order.length?ask():scen()});
  opts.forEach(o=>{
    const b=el("button",null,o.t);b.type="button";btns.push([b,o]);
    b.addEventListener("click",()=>{
      if(o.ok)score++;
      btns.forEach(([bb,oo])=>{bb.disabled=true;if(oo.ok)bb.classList.add("ok");else if(bb===b)bb.classList.add("ko")});
      next.hidden=false;fb.textContent=d[3]||"";
    });
    card.append(b);
  });
  const fb=el("p","fb");card.append(fb,next);app.append(card);
}

const norm=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const clean=s=>s.normalize("NFC").replace(/[^\p{L}\p{N} _-]/gu,"").trim().slice(0,20);
const KEY="fubuki_lb_v1";
function loadLB(){try{const a=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(a)?a.filter(e=>e&&typeof e.n==="string"&&typeof e.s==="number"&&isFinite(e.s)&&typeof e.t==="number").slice(0,1000):[]}catch(e){return[]}}
function saveLB(e){try{const a=loadLB();a.push(e);a.sort((x,y)=>y.s-x.s||x.t-y.t);localStorage.setItem(KEY,JSON.stringify(a.slice(0,500)))}catch(x){}}
function dk(t){const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function board(par,max,day){
  const a=loadLB().filter(e=>!day||dk(e.t)===day).slice(0,max||10);
  if(!a.length){par.append(el("p",null,"Aucun score pour l’instant."));return}
  a.forEach((e,k)=>{const r=el("div","row");r.append(el("span",null,(["🥇","🥈","🥉"][k]||(k+1)+".")+" "+e.n.slice(0,20)),el("span",null,Math.max(0,Math.min(20,e.s))+"/20"));par.append(r)});
  if(!day)par.append(el("p","fb","Classement enregistré sur cet appareil."));
}
function ranking(){
  clear();const card=el("div","card");
  card.append(el("h1",null,"🏆 Aujourd’hui"));board(card,10,dk(Date.now()));
  card.append(el("h1",null,"🏆 Général"));board(card,10);
  card.append(btn("← Retour",home));app.append(card);

function scen(){
  clear();
  const S=ci<4?SC.c:SC.l;const card=el("div","card");
  card.append(el("p",null,lvl.n+" · Scène de crime 🕵️"),el("p","q",S.q),el("p",null,"Écris comment tu réagirais en tant que criminologue (2 à 6 phrases)."));
  const ta=el("textarea");ta.maxLength=600;ta.rows=6;ta.setAttribute("aria-label","Ta réponse");
  const go=el("button","go","Valider ma réponse");go.type="button";const out=el("div");
  go.addEventListener("click",()=>{
    const t=norm(ta.value);
    if(t.length<15){out.textContent="Écris un peu plus pour que ta réponse soit évaluée.";return}
    go.disabled=true;ta.disabled=true;
    const hit=S.r.filter(r=>r.w.some(w=>t.includes(w)));
    sp=Math.round(hit.length/S.r.length*50)/10;
    out.textContent="";out.append(el("div","big",sp+" / 5"));
    S.r.forEach(r=>out.append(el("p","fb",(hit.includes(r)?"✅ ":"➕ ")+r.l)));
    out.append(el("p","fb","💡 Réponse type : "+S.m));
    const nx=el("button","go","Voir ma note");nx.type="button";nx.addEventListener("click",end);out.append(nx);
  });
  card.append(ta,go,out);app.append(card);
}
