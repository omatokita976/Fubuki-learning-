<title>Fubuki Learning</title>
<style>
:root{--bg1:#fdf2f8;--bg2:#f1e6ff;--card:rgba(255,255,255,.72);--tx:#2e1a47;--mu:#7a6892;--ac:#a855c7;--ac2:#ec6fb0;--ok:#1f8a55;--ko:#c2347a;--bd:rgba(168,85,199,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1b1026;--bg2:#2c1646;--card:rgba(48,28,72,.7);--tx:#f6eefc;--mu:#b9a5d1;--ac:#c58bf0;--ac2:#f08cc4;--ok:#6fdca0;--ko:#ff8fc0;--bd:rgba(197,139,240,.28)}}
:root[data-theme="dark"]{--bg1:#1b1026;--bg2:#2c1646;--card:rgba(48,28,72,.7);--tx:#f6eefc;--mu:#b9a5d1;--ac:#c58bf0;--ac2:#f08cc4;--ok:#6fdca0;--ko:#ff8fc0;--bd:rgba(197,139,240,.28)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--tx);font:17px/1.5 "Avenir Next",Avenir,"Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
.bubbles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bubbles i{position:absolute;bottom:-160px;border-radius:50%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.75),rgba(236,111,176,.22) 45%,rgba(168,85,199,.16));border:1px solid rgba(255,255,255,.45);animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.85}90%{opacity:.7}100%{transform:translate(var(--dx,30px),-120vh);opacity:0}}
@media (prefers-reduced-motion:reduce){.bubbles i{animation:none;opacity:.35;bottom:auto}}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:28px 18px 48px}
h1{font:600 2rem/1.15 Georgia,"Times New Roman",serif;letter-spacing:.3px;margin:8px 0 6px;text-align:center;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:6px 0 16px;color:var(--mu)}
main>p{text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(168,85,199,.16)}
button{display:block;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin:10px 0;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s,border-color .15s,box-shadow .15s}
button:hover:not(:disabled){border-color:var(--ac);transform:translateY(-1px);box-shadow:0 6px 18px rgba(168,85,199,.18)}
button:disabled{cursor:default}
button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
button.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 16%,var(--card))}
button.go{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;text-align:center;border:0;font-weight:600;letter-spacing:.3px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar div{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:3px;transition:width .3s}
.q{font:600 1.2rem/1.4 Georgia,"Times New Roman",serif;margin:0 0 10px;color:var(--tx)}
.fb{color:var(--tx);font-size:.95rem;margin:10px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:6px 0 10px}
input:focus,textarea:focus{outline:2px solid var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.big{font:700 3rem Georgia,serif;text-align:center;margin:10px 0;color:var(--ac)}
.card h1{font-size:1.6rem}
</style>
</head>

function pays(k){
  clear();
  app.append(el("h1",null,"🌍 Choisis ton pays"),el("p",null,"Classe : "+LEVELS[k].n));
  PAYS.forEach(p=>{const b=el("button",null,p.n);b.type="button";b.addEventListener("click",()=>start(k,p));app.append(b)});
  const r=el("button",null,"← Changer de classe");r.type="button";r.addEventListener("click",home);app.append(r);
}
function home(){
  clear();lvl=null;
  app.append(el("h1",null,"❄️ Fubuki Learning"),el("p",null,"Droit & criminologie des pays d’Afrique et du monde · 6e → Terminale. Choisis ta classe pour commencer."));
  app.append(el("p",null,"Contenu éducatif, ne remplace pas un conseil juridique."));
  const inp=el("input");inp.type="text";inp.maxLength=20;inp.placeholder="Ton pseudo";inp.setAttribute("aria-label","Pseudo");inp.value=who;
  const msg=el("p","fb");const rk=el("button",null,"🏆 Voir le classement");rk.type="button";rk.addEventListener("click",ranking);
  app.append(inp,msg,rk);
  LEVELS.forEach((L,k)=>{const b=el("button",null,L.n+" · "+L.s);b.type="button";b.addEventListener("click",()=>{who=clean(inp.value);if(!who){msg.textContent="Entre ton pseudo pour commencer.";return}pays(k)});app.append(b)});
}
function start(k,p){ci=k;cp=p;const C=LEVELS[k];lvl={n:C.n+" · "+p.n,q:p.m?C.q:(k<4?p.c:p.l)};order=shuffle(lvl.q);i=0;score=0;sp=0;ask()}
function ask(){
  clear();
  const d=order[i];
  const bar=el("div","bar");const f=el("div");f.style.width=(i/order.length*100)+"%";bar.append(f);
  const card=el("div","card");
  card.append(el("p",null,lvl.n+" · Question "+(i+1)+"/"+order.length),bar,el("p","q",d[0]));
  const opts=shuffle(d[1].map((t,idx)=>({t,ok:idx===d[2]})));
  const btns=[];
  const next=el("button","go",i+1<order.length?"Suivant →":"Voir mon score");next.type="button";next.hidden=true;
  next.addEventListener("click",()=>{i++;i<order.length?ask():scen()});
  opts.forEach(o=>{
    const b=el("button",null,o.t);b.type="button";btns.push([b,o]);
    b.addEventListener("click",()=>{
      if(o.ok)score++;
      btns.forEach(([bb,oo])=>{bb.disabled=true;if(oo.ok)bb.classList.add("ok");else if(bb===b)bb.classList.add("ko")});
      next.hidden=false;fb.textContent=d[3]||"";
    });
    card.append(b);
  });
  const fb=el("p","fb");card.append(fb,next);app.append(card);
}

const norm=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const clean=s=>s.normalize("NFC").replace(/[^\p{L}\p{N} _-]/gu,"").trim().slice(0,20);
const KEY="fubuki_lb_v1";
function loadLB(){try{const a=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(a)?a.filter(e=>e&&typeof e.n==="string"&&typeof e.s==="number"&&isFinite(e.s)).slice(0,200):[]}catch(e){return[]}}
function saveLB(e){try{const a=loadLB();a.push(e);a.sort((x,y)=>y.s-x.s||x.t-y.t);localStorage.setItem(KEY,JSON.stringify(a.slice(0,50)))}catch(x){}}
function board(par,max){
  const a=loadLB().slice(0,max||10);
  if(!a.length){par.append(el("p",null,"Aucun score pour l’instant."));return}
  a.forEach((e,k)=>{const r=el("div","row");r.append(el("span",null,(["🥇","🥈","🥉"][k]||(k+1)+".")+" "+e.n.slice(0,20)),el("span",null,Math.max(0,Math.min(20,e.s))+"/20"));par.append(r)});
  par.append(el("p","fb","Classement enregistré sur cet appareil."));
}
function ranking(){
  clear();const card=el("div","card");card.append(el("h1",null,"🏆 Classement"));board(card,20);
  const b=el("button",null,"← Retour");b.type="button";b.addEventListener("click",home);card.append(b);app.append(card);
}
function scen(){
  clear();
  const S=ci<4?SC.c:SC.l;const card=el("div","card");
  card.append(el("p",null,lvl.n+" · Scène de crime 🕵️"),el("p","q",S.q),el("p",null,"Écris comment tu réagirais en tant que criminologue (2 à 6 phrases)."));
  const ta=el("textarea");ta.maxLength=600;ta.rows=6;ta.setAttribute("aria-label","Ta réponse");
  const go=el("button","go","Valider ma réponse");go.type="button";const out=el("div");
  go.addEventListener("click",()=>{
    const t=norm(ta.value);
    if(t.length<15){out.textContent="Écris un peu plus pour que ta réponse soit évaluée.";return}
    go.disabled=true;ta.disabled=true;
    const hit=S.r.filter(r=>r.w.some(w=>t.includes(w)));
    sp=Math.round(hit.length/S.r.length*50)/10;
    out.textContent="";out.append(el("div","big",sp+" / 5"));
    S.r.forEach(r=>out.append(el("p","fb",(hit.includes(r)?"✅ ":"➕ ")+r.l)));
    out.append(el("p","fb","💡 Réponse type : "+S.m));
    const nx=el("button","go","Voir ma note");nx.type="button";nx.addEventListener("click",end);out.append(nx);
  });
  card.append(ta,go,out);app.append(card);
}
function end(){
  clear();
  const tot=Math.round((score+sp)/(order.length+5)*200)/10;
  saveLB({n:who,s:tot,c:lvl.n,t:Date.now()});
  const card=el("div","card");
  card.append(el("h1",null,"Résultat · "+who),el("p",null,lvl.n),el("div","big",tot+" / 20"),
    el("p",null,"QCM : "+score+"/"+order.length+" · Scène de crime : "+sp+"/5"),
    el("p",null,tot>=16?"¡Excelente ! Criminologue en devenir. 🕵️":tot>=10?"¡Muy bien ! Continue comme ça.":"Courage, réessaie pour progresser !"),
    el("h1",null,"🏆 Classement"));
  board(card,10);
  const a=el("button","go","Recommencer");a.type="button";a.addEventListener("click",()=>start(ci,cp));
  const c=el("button",null,"Changer de pays");c.type="button";c.addEventListener("click",()=>pays(ci));
  const b=el("button",null,"Changer de classe");b.type="button";b.addEventListener("click",home);
  card.append(a,c,b);app.append(card);
}
